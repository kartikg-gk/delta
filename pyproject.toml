[project]
name = "deltaa"
version = "0.2.0"
description = "A minimal coding agent harness in Python, inspired by pi (TypeScript)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kartik G" }]
keywords = ["agent", "cli", "coding-agent", "llm", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7",
    "httpx[socks]>=0.27",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/kartikg-gk/delta"
Repository = "https://github.com/kartikg-gk/delta"
Issues = "https://github.com/kartikg-gk/delta/issues"

[project.scripts]
delta = "delta_app.cli.main:main"

[dependency-groups]
# Development tools; installed by `uv sync`, never part of the published package.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a consumer needs.
include = ["/src/delta_harness", "/src/delta_model", "/src/delta_app", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/delta_harness", "src/delta_model", "src/delta_app"]

[tool.hatch.build]
# Editable installs expose all of src/.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry long canned payloads and expected-completion strings.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
